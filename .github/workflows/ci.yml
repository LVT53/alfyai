name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      # The artifact-contract gate, in its replay form only: it re-scores the
      # committed model answers with no model, no key and no browser. The live
      # harness (eval:artifacts, eval:artifacts:tools) talks to the production
      # model and never runs here. `svelte-kit sync` writes the `$lib` alias the
      # script resolves through.
      - name: Artifact contract replay
        run: npx svelte-kit sync && npm run eval:artifacts:replay

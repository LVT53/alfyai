# Apache VirtualHost Configuration for AlfyAI
# Template file - replace placeholders with actual values

<VirtualHost *:443>
    ServerName chat.example.com
    
    # SSL (Virtualmin/Let's Encrypt)
    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/chat.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/chat.example.com/privkey.pem
    
    # Proxy settings
    ProxyRequests Off
    ProxyPreserveHost On

    # --- D2 (ADR-0054): maintenance page ---------------------------------
    # Serve a static 503 maintenance page (outside the app build tree) during
    # a deploy's restart window, and whenever the Node backend is unreachable.
    #
    # ORDERING IS LOAD-BEARING: the `ProxyPass /alfyai-maintenance !` exclusion
    # MUST appear BEFORE the catch-all `ProxyPass /` below, or the maintenance
    # path is proxied to the (down) backend and the ErrorDocument subrequest
    # recurses. On a Virtualmin-managed vhost, `virtualmin modify-web
    # --add-directive` appends custom directives AFTER the auto-generated
    # `ProxyPass /` (and strips the `!`), so this block is applied at the
    # prod cutover via a Virtualmin server-template edit or a reviewed include
    # that guarantees this ordering — NOT via --add-directive.
    Alias /alfyai-maintenance /var/www/alfyai-maintenance
    <Directory /var/www/alfyai-maintenance>
        Require all granted
    </Directory>
    ProxyPass /alfyai-maintenance !
    ErrorDocument 503 /alfyai-maintenance/index.html
    Header always set Retry-After "20" "expr=%{REQUEST_STATUS} == 503"
    # Flag-file toggle: `touch /var/www/alfyai-maintenance/MAINTENANCE` to force
    # the page proactively (deploy sets/removes it); absent = normal serving.
    RewriteEngine On
    RewriteCond /var/www/alfyai-maintenance/MAINTENANCE -f
    RewriteCond %{REQUEST_URI} !^/alfyai-maintenance
    RewriteCond %{REQUEST_URI} !^/api/health
    RewriteRule ^ /alfyai-maintenance/index.html [R=503,L]
    # --- end maintenance page --------------------------------------------

    # General proxy to Node app
    ProxyPass / http://127.0.0.1:3001/
    ProxyPassReverse / http://127.0.0.1:3001/
    
    # Streaming endpoints need special handling to disable buffering
    <LocationMatch "^/api/(chat/stream|settings/account/archive)(?:$|/)">
        # Disable proxy buffering for streaming responses
        SetEnv proxy-sendchunked 1
        SetEnv proxy-nokeepalive 1
        
        # Disable gzip for streaming responses
        SetEnv no-gzip 1
        
        # Ensure immediate flush
        ProxyPass http://127.0.0.1:3001 flushpackets=on
    </LocationMatch>
    
    # Timeouts (generous for long-running requests)
    ProxyTimeout 300
    
    # Required modules: mod_proxy, mod_proxy_http, mod_ssl, mod_headers, mod_setenvif
</VirtualHost>

# HTTP to HTTPS redirect
<VirtualHost *:80>
    ServerName chat.example.com
    Redirect permanent / https://chat.example.com/
</VirtualHost>

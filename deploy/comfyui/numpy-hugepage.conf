# Drop-in for comfyui.service, comfyui-h3.service and comfyui-ltx.service, as
# /etc/systemd/system/<unit>.service.d/numpy-hugepage.conf (deploy/comfyui/README.md).
#
# NumPy marks every large array MADV_HUGEPAGE. The GPU box runs transparent huge
# pages with defrag=madvise, so the first touch of such an array may compact
# memory synchronously inside the page fault, and on this box's fragmented memory
# that took 4-27 s of kernel time while the GPU sat idle: ComfyUI turns every
# picture into large NumPy arrays (PreviewImage's save after the decode, LoadImage
# before an edit's encode). With the hint off the same work takes milliseconds.
# It only changes which page size NumPy asks for, never a pixel.
# docs/plans/minimax-h3-image/speed-investigation-2026-11-18.md
[Service]
Environment=NUMPY_MADVISE_HUGEPAGE=0

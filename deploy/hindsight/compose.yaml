name: alfyai-memory
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: hindsight
      POSTGRES_USER: hindsight
      POSTGRES_PASSWORD: ${HINDSIGHT_DB_PASSWORD:?Set a private database password}
    volumes:
      - memory-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hindsight -d hindsight"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  hindsight:
    build: .
    image: alfyai-hindsight:9fb28dbd724dc1ce4da7cb4c49008e601db76c5f
    env_file:
      - native-tenants.env
      - native-model.env
    environment:
      HINDSIGHT_API_DATABASE_URL: postgresql://hindsight:${HINDSIGHT_DB_PASSWORD_URI:?Set a URI-encoded private database password}@postgres:5432/hindsight
      HINDSIGHT_API_WORKER_ID: "${HINDSIGHT_API_WORKER_ID:?Set a persistent native worker ID}"
      HINDSIGHT_API_LLM_TRACE_ENABLED: "false"
      HINDSIGHT_API_LLM_TRACE_DELETE_WITH_DOCUMENT: "true"
      HINDSIGHT_API_OTEL_TRACES_ENABLED: "false"
      HINDSIGHT_API_ENABLE_DRY_RUN_EXTRACT: "${HINDSIGHT_API_ENABLE_DRY_RUN_EXTRACT:-false}"
      HINDSIGHT_API_LOG_LEVEL: warning
      HINDSIGHT_API_TENANT_SCHEMA_PREFIX: alfyai
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: onnx
      HINDSIGHT_API_RERANKER_PROVIDER: flashrank
      HINDSIGHT_API_RERANKER_FLASHRANK_MODEL: ms-marco-MultiBERT-L-12
      # One until measured. The admission gateway now holds a call over the budget in its
      # queue instead of answering 429 at once, so fan-out may rise, one step at a time and
      # only as README.md ("When fan-out and retries may change") allows.
      HINDSIGHT_API_LLM_MAX_CONCURRENT: "1"
      # Twelve until measured. A full queue or a spent wait still answers 429, which these
      # retries wait out (backoff 1 s up to 60 s) instead of failing consolidation or
      # extraction; back toward the default 3 only after a week with no refusals (README.md).
      HINDSIGHT_API_LLM_MAX_RETRIES: "12"
      # Hindsight gives up on its own model call after this many seconds (120 by default),
      # and the admission queue may hold that call up to HINDSIGHT_API_HTTP_ADMISSION_NATIVE_WAIT_S
      # (600) before the model's own run (up to 180). It must outlast both, or Hindsight's
      # retries would do the waiting again; test_effective_config.py checks it in the image.
      HINDSIGHT_API_LLM_TIMEOUT: "800"
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_BASE_URL: http://127.0.0.1:8888/ext/alfyai/inference/v1
      HINDSIGHT_API_SKIP_LLM_VERIFICATION: "true"
      HINDSIGHT_API_RETAIN_LLM_EXTRA_BODY: '{"chat_template_kwargs":{"enable_thinking":true},"max_tokens":8192}'
      HINDSIGHT_API_ADMISSION_RETAIN_MAX_WAIT_MS: "1000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8888:8888"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  memory-db:
